name: Baixar XML do TCE-PR

# O TCE-PR regenera o "Download de Dados" uma vez por semana, aos domingos
# (Last-Modified por volta de 14h UTC). Segunda às 12h UTC (9h em Brasília)
# dá folga para a geração terminar.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baixar-tce
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Baixar ano corrente e anos já presentes
        run: node scripts/baixar-tce.mjs --existentes "$(date -u +%Y)"

      # APIs federais instáveis: falha aqui não impede o commit do TCE-PR.
      - name: Baixar obras com recurso federal (Obrasgov.br)
        continue-on-error: true
        run: node scripts/baixar-obrasgov.mjs

      - name: Baixar o SINAPI mais recente (preços de referência do PR)
        continue-on-error: true
        run: node scripts/baixar-sinapi.mjs

      - name: Baixar contratações e documentos do PNCP
        continue-on-error: true
        run: node scripts/baixar-pncp.mjs "$(date -u +%Y)"

      - name: Consultar na Receita os CNPJs novos (e os consultados há mais de 30 dias)
        run: node scripts/consultar-cnpj.mjs --dias 30

      - name: Commit se o TCE publicou algo novo
        run: |
          git add dados/tce dados/tce-obras dados/obrasgov dados/pncp dados/sinapi dados/cnpj dados/ibge
          if git diff --cached --quiet; then
            echo "Nada mudou no TCE-PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "dados: XML do TCE-PR ($(date -u +%Y-%m-%d))"
          git push
