name: ETL Siconfi

on:
  schedule:
    - cron: "30 7 * * *"  # diário, 04:30 em Brasília: incremental
    - cron: "30 8 1 * *"  # dia 1 de cada mês: reverifica tudo (pelo hash)
  workflow_dispatch:
    inputs:
      desde:
        description: "Primeiro exercício (vazio = desde 2013)"
        required: false
      forcar:
        description: "Reverificar todos os relatórios"
        type: boolean
        default: false

# nunca duas cargas ao mesmo tempo
concurrency:
  group: etl-siconfi
  cancel-in-progress: false

jobs:
  siconfi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-etl.txt

      - run: pip install -r requirements-etl.txt

      - name: Coletar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DESDE: ${{ inputs.desde }}
          FORCAR: ${{ inputs.forcar || github.event.schedule == '30 8 1 * *' }}
        run: |
          args=()
          if [ -n "$DESDE" ]; then args+=(--desde "$DESDE"); fi
          if [ "$FORCAR" = "true" ]; then args+=(--forcar); fi
          python -m etl siconfi "${args[@]}"

      # roda mesmo se alguma coleta falhou: transforma o que foi coletado
      - name: Transformar
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m etl transformar
